apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes
spec:
  rules:
    - host: notes.local   # overlay 用 patch 換成 notes-staging.local / notes.local
      http:
        paths:
          # 順序在 Traefik 不重要，它用「最長前綴優先」：
          # /api/records 同時符合 /api 與 /，但 /api 比較長，所以由 api 接走。
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: notes-api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: notes-web
                port:
                  number: 80
